<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crear cuenta — AgendaYA</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="barra">
  <div class="marca">Agenda<span>YA</span></div>
  <nav><a href="/" data-cy="nav-ingresar">Ingresar</a></nav>
</header>

<main class="hoja">
  <h1>Crear cuenta</h1>
  <p class="bajada">Registrate para administrar tu agenda de turnos.</p>

  <div class="aviso mal" data-cy="alerta-error" role="alert" hidden></div>
  <div class="aviso ok" data-cy="alerta-exito" role="status" hidden></div>

  <form data-cy="registro-form" novalidate>
    <div class="campo" data-campo="nombre">
      <label for="nombre">Nombre y apellido</label>
      <input type="text" id="nombre" data-cy="nombre-input" autocomplete="name">
      <p class="detalle-error" data-cy="error-nombre"></p>
    </div>

    <div class="campo" data-campo="email">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" data-cy="email-input" autocomplete="email" placeholder="nombre@ejemplo.com">
      <p class="detalle-error" data-cy="error-email"></p>
    </div>

    <div class="campo" data-campo="password">
      <label for="password">Contraseña</label>
      <input type="password" id="password" data-cy="password-input" autocomplete="new-password">
      <p class="ayuda">Mínimo 8 caracteres, con al menos una mayúscula, una minúscula y un número.</p>
      <p class="detalle-error" data-cy="error-password"></p>
    </div>

    <button type="submit" id="botonRegistrar" data-cy="registro-button" class="ancho-total">Registrarse</button>
  </form>

  <p class="pie-formulario">¿Ya tenés cuenta? <a href="/" data-cy="link-login">Ingresar</a></p>
</main>

<script src="logica/validaciones.js"></script>
<script src="comun.js"></script>
<script>
const boton = document.getElementById("botonRegistrar");

document.querySelector('[data-cy="registro-form"]').addEventListener("submit", async (e) => {
  e.preventDefault();
  limpiarErrores();
  ocultarAvisos();

  const nombre = document.getElementById("nombre").value;
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  const error = AgendaValidaciones.validarRegistro({ nombre, email, password });
  if (error) {
    marcarError(error.campo, error.mensaje);
    return;
  }

  boton.disabled = true;
  boton.textContent = "Creando cuenta...";

  const { ok, datos } = await pedir("/api/registro", { nombre, email, password });

  if (ok) {
    guardarSesion(datos.usuario);
    window.location.href = "dashboard.html?bienvenida=1";
    return;
  }

  // CP-004: el correo ya existe, no se crea la cuenta
  mostrarError(datos.mensaje);
  if (datos.campo) marcarError(datos.campo, datos.mensaje);

  boton.disabled = false;
  boton.textContent = "Registrarse";
});
</script>

</body>
</html>
