<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ingresar — AgendaYA</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="barra">
  <div class="marca">Agenda<span>YA</span></div>
  <nav><a href="reservar.html" data-cy="nav-reservar">Reservar un turno</a></nav>
</header>

<main class="hoja">
  <h1>Ingresar</h1>
  <p class="bajada">Accedé al panel para administrar tu agenda.</p>

  <div class="aviso mal" data-cy="alerta-error" role="alert" hidden></div>
  <div class="aviso ok" data-cy="alerta-exito" role="status" hidden></div>

  <form data-cy="login-form" novalidate>
    <div class="campo" data-campo="email">
      <label for="email">Usuario</label>
      <input type="email" id="email" data-cy="email-input" autocomplete="username" placeholder="nombre@ejemplo.com">
      <p class="detalle-error" data-cy="error-email"></p>
    </div>

    <div class="campo" data-campo="password">
      <label for="password">Contraseña</label>
      <input type="password" id="password" data-cy="password-input" autocomplete="current-password">
      <p class="detalle-error" data-cy="error-password"></p>
    </div>

    <button type="submit" id="botonIngresar" data-cy="login-button" class="ancho-total">Ingresar</button>
  </form>

  <p class="pie-formulario">
    <a href="recuperar.html" data-cy="link-recuperar">¿Olvidaste tu contraseña?</a><br>
    ¿No tenés cuenta? <a href="registro.html" data-cy="link-registro">Crear una</a>
  </p>
</main>

<script src="logica/validaciones.js"></script>
<script src="comun.js"></script>
<script>
const boton = document.getElementById("botonIngresar");

if (new URLSearchParams(location.search).get("sesion") === "cerrada") {
  mostrarExito("Cerraste sesión correctamente.");
}

document.querySelector('[data-cy="login-form"]').addEventListener("submit", async (e) => {
  e.preventDefault();
  limpiarErrores();
  ocultarAvisos();

  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;

  // Validacion en el cliente con la misma logica que prueba Jest
  const error = AgendaValidaciones.validarLogin({ email, password });
  if (error) {
    marcarError(error.campo, error.mensaje);
    return;
  }

  boton.disabled = true;
  boton.textContent = "Verificando...";

  const { ok, datos } = await pedir("/api/login", { email, password });

  if (ok) {
    guardarSesion(datos.usuario);
    window.location.href = "dashboard.html";
    return;
  }

  // CP-002: se informa el error y se limpia el campo de contrasena por seguridad
  document.getElementById("password").value = "";
  mostrarError(datos.mensaje);
  if (datos.campo) marcarError(datos.campo, datos.mensaje);

  boton.disabled = false;
  boton.textContent = "Ingresar";
});
</script>

</body>
</html>
