<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Recuperar contraseña — AgendaYA</title>
<link rel="stylesheet" href="estilos.css">
</head>
<body>

<header class="barra">
  <div class="marca">Agenda<span>YA</span></div>
  <nav><a href="/" data-cy="nav-ingresar">Ingresar</a></nav>
</header>

<main class="hoja">
  <h1>Recuperar contraseña</h1>
  <p class="bajada">Te enviamos un enlace para elegir una contraseña nueva.</p>

  <div class="aviso mal" data-cy="alerta-error" role="alert" hidden></div>
  <div class="aviso ok" data-cy="alerta-exito" role="status" hidden></div>

  <form data-cy="recuperar-form" novalidate>
    <div class="campo" data-campo="email">
      <label for="email">Correo electrónico</label>
      <input type="email" id="email" data-cy="email-input" autocomplete="email" placeholder="nombre@ejemplo.com">
      <p class="detalle-error" data-cy="error-email"></p>
    </div>

    <button type="submit" id="botonEnviar" data-cy="recuperar-button" class="ancho-total">Enviar el enlace de recuperación</button>
  </form>

  <p class="pie-formulario"><a href="/" data-cy="link-login">Volver a ingresar</a></p>
</main>

<script src="logica/validaciones.js"></script>
<script src="comun.js"></script>
<script>
const boton = document.getElementById("botonEnviar");

document.querySelector('[data-cy="recuperar-form"]').addEventListener("submit", async (e) => {
  e.preventDefault();
  limpiarErrores();
  ocultarAvisos();

  const email = document.getElementById("email").value;
  if (!AgendaValidaciones.normalizarEmail(email)) {
    marcarError("email", "Ingresa tu correo electronico.");
    return;
  }

  boton.disabled = true;
  boton.textContent = "Enviando...";

  const { ok, datos } = await pedir("/api/recuperar", { email });

  if (ok) {
    // CP-005: el correo queda en la consola del servidor y en data/correos.log
    mostrarExito(datos.mensaje);
  } else {
    // CP-006: el correo no esta registrado
    mostrarError(datos.mensaje);
    if (datos.campo) marcarError(datos.campo, datos.mensaje);
  }

  boton.disabled = false;
  boton.textContent = "Enviar el enlace de recuperación";
});
</script>

</body>
</html>
